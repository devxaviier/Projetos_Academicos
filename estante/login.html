<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar · Estante</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/tema.js"></script>
    <script src="js/fonte.js"></script>
    <script src="js/usuario.js"></script>
  </head>
  <body>
    <!-- parte do cabeçalho com logo e menu de navegação. -->
    <header class="cabecalho">
      <a href="index.html" class="logo">Estante</a>
      <nav aria-label="Navegação principal">
        <ul class="menu">
          <li><a href="index.html">Início</a></li>
          <li><a href="catalogo.html">Catálogo</a></li>
          <li><a href="clubes.html">Clubes</a></li>
          <li><a href="perfil.html">Perfil</a></li>
          <li><a href="#">Listas</a></li>
          <li><a href="contato.html">Contato</a></li>
          <li><a href="login.html" aria-current="page">Entrar</a></li>
          <li><button id="botao-tema" type="button">Modo escuro</button></li>
        </ul>
      </nav>
    </header>

    <!-- sessão principal da página, com formulário de login, campos para e-mail e
    senha, mensagens de erro e link para criar conta. -->
    <main>
      <section class="login-card">
        <h1>Entrar na Estante</h1>

        <form id="form-login" class="formulario" novalidate>
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
          />
          <span class="erro" id="erro-email" role="alert"></span>

          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            required
            minlength="6"
            autocomplete="current-password"
          />
          <span class="erro" id="erro-senha" role="alert"></span>

          <button type="submit">Entrar</button>
        </form>

        <!-- div que contém um link para criar uma nova conta, caso o usuário ainda
        não tenha uma. -->
        <p>Ainda não tem conta? <a href="#">Criar conta</a></p>
      </section>
    </main>

    <footer class="rodape">
      <p>Estante · projeto acadêmico · CEUB</p>
      <nav aria-label="Links do rodapé">
        <a href="contato.html">Contato</a>
        <a href="https://github.com/devxaviier">GitHub</a>
        <a href="acessibilidade.html">Acessibilidade (WCAG)</a>
      </nav>
    </footer>
    <script src="js/login.js"></script>
  </body>
</html>
